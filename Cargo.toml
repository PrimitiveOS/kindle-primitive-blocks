[workspace]
resolver = "2"
members = ["crates/blocks-core", "crates/blocks-render", "crates/blocks-kindle", "crates/blocks-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
blocks-core = { path = "crates/blocks-core" }
blocks-render = { path = "crates/blocks-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
